version: '3'

services:
  prometheus:
    image: prom/prometheus:v2.49.1 
    container_name: monitoring_prometheus2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1y
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.external-url=http://localhost:9090/prometheus/
    ports:
      - 9091:9090
    networks:
      - sentilo_network2
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  node-exporter: 
    image: prom/node-exporter:v1.7.0
    container_name: monitoring_node-exporter2
    restart: unless-stopped 
    volumes: 
      - /proc:/host/proc:ro 
      - /sys:/host/sys:ro 
      - /:/rootfs:ro 
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.rootfs=/rootfs' 
      - '--path.sysfs=/host/sys' 
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)' 
    networks: 
      - sentilo_network2

  cadvisor: 
    image: gcr.io/cadvisor/cadvisor:latest 
    container_name: monitoring_cadvisor2
    ports: 
      - 8082:8080 
    networks: 
      - sentilo_network2
    volumes: 
      - /:/rootfs:ro 
      - /var/run:/var/run:rw 
      - /sys:/sys:ro 
      - /var/lib/docker/:/var/lib/docker:ro 

  grafana:
    image: grafana/grafana:10.2.3
    container_name: monitoring_grafana2
    volumes:
      - grafana-data-2:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
    ports:
      - 3000:3000
    networks:
      - sentilo_network2

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: monitoring_elasticsearch-exporter2
    command:
     - '--es.uri=http://${ELASTIC_USER}:${ELASTIC_PASSWORD}@es01:9200'
    networks:
      - sentilo_network2

networks:
  sentilo_network2:
    name: sentilo_network2
    external: true

volumes:
  grafana-data-2:
    driver: local
