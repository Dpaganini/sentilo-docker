version: '3'

services:
  es012:
    image: elasticsearch:$ELK_VERSION
    container_name: elastic_es012
    environment:
      - ELASTIC_PASSWORD=$ELASTIC_PASSWORD
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - 9200:9200
    volumes:
      - es01_data-2:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:$ELASTIC_CONF_PATH/elasticsearch.yml
      - ./certs:$ELASTIC_CONF_PATH/certs
    networks:
      - sentilo_network2
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null; if [[ $$? == 52 ]]; then echo 0; else echo 1; fi
      interval: 30s
      timeout: 10s
      retries: 5 

  kibana:
    image: kibana:$ELK_VERSION
    container_name: elastic_kibana2
    # ports:
    #   - 5601:5601
    volumes:
      - ./kibana/kibana.yml:$KBN_CONF_PATH/kibana.yml
      - ./certs:$KBN_CONF_PATH/certs/
    environment:
      KIBANA_USER: $KIBANA_USER
      KIBANA_PASSWORD: $KIBANA_PASSWORD
    networks:
      - sentilo_network2
    depends_on:
      es012:
        condition: service_healthy

  logstash:
    image: logstash:$ELK_VERSION
    container_name: elastic_logstash2
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/logstash.yml:$LOGSTASH_CONF_PATH/logstash.yml
      - ./certs/:$LOGSTASH_CONF_PATH/certs/
    environment:
      LOGSTASH_USER: $LOGSTASH_USER
      LOGSTASH_PASSWORD: $LOGSTASH_PASSWORD
    depends_on:
      es012:
        condition: service_healthy   
    
    networks:
      - sentilo_network2

  agent-proxy:
    image: nginx:latest
    container_name: elastic_agent_nginx
    volumes:
      - ../proxy/agent/default.conf:/etc/nginx/conf.d/default.conf
      - ../certs/:/etc/nginx/certs/
    depends_on:
      es012:
        condition: service_healthy
    networks:
      - sentilo_network2
  
networks:
  sentilo_network2:
    name: sentilo_network2
    external: true

volumes:
  es01_data-2:
    driver: local