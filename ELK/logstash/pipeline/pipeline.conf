input {
  redis {
    host => "sentilo-redis"
    password => "sentilo"
    data_type => "pattern_channel"
    key => "/*[data,order,alarm]/*"
  }
}

filter {
  grok {
    match => {
      "sensor" => [
        "%{GREEDYDATA:component}_%{GREEDYDATA:sensor_type}_%{NUMBER:sensor_number}",
        "%{GREEDYDATA:component}_%{GREEDYDATA:sensor_type}_%{GREEDYDATA:sensor_flag}",
        "%{GREEDYDATA:sensor_type}_%{GREEDYDATA:sensor_number}",
        "%{GREEDYDATA}"
      ]
    }
  }

  # Só tenta parsear JSON quando message "parecer" JSON
#  if [message] and [message] =~ /^\s*[{[]/ {
#    json {
#      source => "message"
#      target => "doc"
#      tag_on_failure => ["_jsonparsefailure"]
#    }
#  }

  # Normaliza location: "lat lon" -> "lat,lon"
#  if [location] {
#    mutate {
#      strip => ["location"]
#      gsub  => ["location", "\s+", ","]
#    }
#  }

  if [location] {
    mutate {
      copy => { "location" => "location_geo" }
    }
    mutate {
      gsub => [ "location_geo", " ", ", " ]
    }
  }

  # Usa o horário real do evento (payload Sentilo) em vez do horário de ingestão do Logstash
  if [time] {
    date {
      match => ["time", "UNIX_MS"]
      target => "@timestamp"
    }
  } else if [timestamp] {
    date {
      match => ["timestamp", "dd/MM/yyyy HH:mm:ss"]
      target => "@timestamp"
    }
  }

  mutate {
    remove_field => ["event", "topic", "version", "time", "timestamp"]
  }
}

output {
  elasticsearch {
    hosts => "http://es01:9200"
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    index => "sentilo-ds-%{+yyyy.MM}"
    action => "create"
  }
}
