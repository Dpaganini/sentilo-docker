services:
  # databases
  sentilo-redis-2:
    image: redis:${REDIS_VERSION}
    container_name: sentilo-redis-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes"]
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - sentilo-redis-vol-2:/data
    ports:
      - "6380:6379"
    networks:
      - sentilo_network2
               
  sentilo-mongodb2:
    image: mongo:${MONGO_VERSION}
    container_name: sentilo-mongodb2
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_INITDB_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_INITDB_ROOT_PASSWORD
      MONGO_INITDB_DATABASE: sentilo2
    volumes:
      - ./config/mongo/config/mongod.conf:/etc/mongod/mongod.conf
      - ./config/mongo/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
      - sentilo-mongo-vol-2:/data
    ports:
      - "27017:27017"
    expose:
      - 27017
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongo -u $MONGO_INITDB_ROOT_USERNAME -p '$MONGO_INITDB_ROOT_PASSWORD' --quiet) -eq 1
      interval: 10s
      start_period: 30s
    command: [ "--replSet", "rs_sentilo", "--bind_ip_all" ]
    networks:
      - sentilo_network2

  # api-server    
  sentilo-platform-server2:
    image: sentilo/sentilo-platform-server:${SENTILO_VERSION}
    container_name: sentilo-platform-server2
    volumes:
      - ./conf/:/etc/sentilo/
      - ./logs/:/var/log/sentilo/
    ports:
      - "7081:7081"
      - "8081:8081"
    depends_on:
      sentilo-catalog-web:
        condition: service_healthy
    networks:
      - sentilo_network2

  # web-catalog
  sentilo-catalog-web2:
    image: sentilo/sentilo-catalog-web:${SENTILO_VERSION}
    container_name: sentilo-catalog-web2
    ports:
      - "8080:8080"
    depends_on:
      sentilo-mongodb2:
        condition: service_healthy
      sentilo-redis2:
        condition: service_started
    environment:
      JAVA_OPTS: "-Dsentilo.multitenant=true -Dspring.profiles.active=dev -Dsentilo.state_page.enabled=true"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://sentilo-catalog-web2:8080/sentilo-catalog-web/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 0s
    volumes:
      - ./conf/:/etc/sentilo/
      - ./logs/:/var/log/sentilo/
    networks:
      - sentilo_network2

  # agents in general
  sentilo-agent-alert2:
    image: sentilo/sentilo-agent-alert:${SENTILO_VERSION}
    container_name: sentilo-agent-alert2
    volumes:
      - ./conf/:/etc/sentilo/
      - ./logs/:/var/log/sentilo/
    depends_on:
      sentilo-platform-server2:
        condition: service_started
      sentilo-mongodb2:
        condition: service_healthy
    networks:
      - sentilo_network2

  sentilo-agent-location-updater2:
    image: sentilo/sentilo-agent-location-updater:${SENTILO_VERSION}
    container_name: sentilo-agent-location-updater2
    volumes:
      - ./conf/:/etc/sentilo/
      - ./logs/:/var/log/sentilo/
    depends_on:
      - sentilo-platform-server2
    networks:
      - sentilo_network2
  
networks:
  sentilo_network2:
    name: sentilo_network2
    external: true

volumes:
  sentilo-mongo-vol-2:
    external: true
  sentilo-redis-vol-2:
    external: true
